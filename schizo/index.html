<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>gif</title>

  <!-- Open Graph tags (Discord reads these) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="schizo">
  <meta property="og:image" content="https://prcae.github.io/test/schizo.gif">

  <!-- Twitter card, Discord also checks this -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://prcae.github.io/test/schizo.gif">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="../schizo.gif" alt="gif">
</body>
</html>
